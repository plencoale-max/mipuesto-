<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi puesto · Team building 333</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--azul:#1F6DB1;--azul-claro:#D1E3F6;--naranja:#E87722;--gris:#53565A;--verde:#8CC63F;
  --bg:#FFFFFF;--ink:#1d2a38;--muted:#53565A;--card:#FFFFFF;--line:#D1E3F6;--soft:#EEF5FC}
@media (prefers-color-scheme:dark){:root{--bg:#0f2236;--ink:#EEF5FC;--muted:#D1E3F6;--card:#163252;--line:#244a73;--soft:#1a3a5e}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
button,textarea,input,select{font-family:inherit;font-size:16px}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(16px,3vw,36px);display:flex;flex-direction:column;gap:22px}
.logo{height:56px;width:auto;background:#fff;border-radius:10px;padding:6px 8px;align-self:flex-start}
h1{font-size:clamp(30px,5vw,54px);line-height:1.05;margin:0;font-weight:900;color:var(--azul)}
h2{margin:0;font-size:20px}h3{margin:0;font-size:17px}p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:700;text-decoration:none;display:inline-block}
.btn-main{background:var(--azul);color:#fff}
.btn-cta{background:var(--naranja);color:#fff}
.btn-ghost{background:none;border:2px solid var(--azul);color:var(--ink)}
.link{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,26px)}
.note{background:var(--soft);border-radius:14px;padding:14px 18px;font-size:15px}
.err{color:var(--naranja);font-weight:600;font-size:14px}
label{font-weight:700;display:block;margin-bottom:6px}
input,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.hint{font-weight:400;color:var(--muted);font-size:14px;display:block}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tbtn{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;font-weight:700;color:var(--ink)}
.tbtn:hover{border-color:var(--azul)}
.q{display:grid;grid-template-columns:36px 1fr;gap:12px}
.q .n{width:36px;height:36px;border-radius:50%;background:var(--azul);color:#fff;font-weight:900;display:grid;place-items:center}
.person{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:12px 16px}
.done{color:#5b9a1c;font-weight:700;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .v{font-size:38px;font-weight:900;line-height:1;color:var(--azul)}
.kpi .l{font-size:14px;font-weight:600;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.tcard[open]{grid-column:1/-1}
.tcard summary{list-style:none;cursor:pointer;display:grid;gap:6px}
.tcard summary::-webkit-details-marker{display:none}
.tname{font-size:20px;font-weight:900;color:var(--azul)}
.tcount{font-weight:700;color:var(--naranja)}
.names{margin:4px 0 0;padding-left:18px;font-size:15px}
.more{font-size:14px;font-weight:600;color:var(--azul);text-decoration:underline}
.pans{border-top:2px solid var(--line);padding-top:12px;display:grid;gap:8px}
.pans small{display:block;font-weight:700;color:var(--muted);font-size:13px}
.pans p{white-space:pre-wrap}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.teams{grid-template-columns:repeat(2,1fr)}}
</style>

  <main id="app"></main>

<script>
/* ===== CONFIGURACIÓN: pegá acá los datos de tu proyecto Supabase ===== */
const SUPABASE_URL = "https://svmjbqhnefbpavtopeyc.supabase.co";
const SUPABASE_KEY = "sb_publishable_DhP8Xzumsv5j4ldMzy8eZA_7BVdM8Ld";
/* ===================================================================== */

const qs = new URLSearchParams(location.search);
const VISTA = qs.get("vista")==="tablero" ? "tablero" : "equipo";
const CLAVE = qs.get("clave") || "";
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const QUESTIONS = [
  {t:"¿Para qué existe tu puesto?", h:"El objetivo principal, en una o dos frases."},
  {t:"¿Cuáles son tus 3 responsabilidades principales?", h:"Lo que sí o sí depende de vos."},
  {t:"¿Qué decisiones podés tomar sin consultar?", h:"Y cuáles tenés que consultar antes."},
  {t:"¿Qué entregás, a quién y cada cuánto?", h:"Informes, contenidos, respuestas, cierres…"},
  {t:"¿Qué hacés hoy que no sabés si es tuyo?", h:"O algo que creés que debería hacer otra persona."}
];
const TEAMS = Array.from({length:9},(_,i)=>"Equipo "+(i+1));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = $("#app");

/* ---------- EQUIPO ---------- */
let team = null, sent = [], editing = false;
try{ const st=JSON.parse(localStorage.getItem("mipuesto-equipo")||"null"); if(st){ team=st.team||null; sent=st.sent||[]; } }catch(e){}
function persist(){ try{ localStorage.setItem("mipuesto-equipo", JSON.stringify({team,sent})); }catch(e){} }
function renderTeam(){
  if(!team){
    app.innerHTML = `<div class="stack"><h1>Mi puesto</h1>
      <p style="font-size:18px;max-width:56ch">Cada integrante del equipo responde 5 preguntas sobre su puesto. No hay respuestas correctas: sirve para ver si todos tenemos la misma foto de los roles.</p>
      <h2>¿Qué equipo son?</h2>
      <div class="teams">${TEAMS.map(t=>`<button class="tbtn" data-t="${t}">${t}</button>`).join("")}</div></div>`;
    app.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>{ team=b.dataset.t; sent=[]; persist(); editing=true; renderTeam(); });
    return;
  }
  if(editing){
    app.innerHTML = `<div class="stack">
      <div class="row" style="justify-content:space-between"><h2 style="color:var(--azul)">${esc(team)}</h2>${sent.length?`<button class="link" id="back">Volver</button>`:`<button class="link" id="chg">Cambiar de equipo</button>`}</div>
      <div class="card stack">
        <div class="row" style="align-items:flex-start">
          <div style="flex:1;min-width:200px"><label for="nombre">Nombre y apellido</label><input id="nombre" autocomplete="off"></div>
          <div style="flex:1;min-width:200px"><label for="puesto">Puesto</label><input id="puesto" autocomplete="off"></div>
        </div>
        ${QUESTIONS.map((q,i)=>`<div class="q"><span class="n">${i+1}</span><div><label for="a${i}">${q.t}<span class="hint">${q.h}</span></label><textarea id="a${i}"></textarea></div></div>`).join("")}
        <p class="err" id="e"></p>
        <div class="row"><button class="btn btn-cta" id="send">Enviar mis respuestas</button></div>
      </div></div>`;
    $("#back") && ($("#back").onclick=()=>{ editing=false; renderTeam(); });
    $("#chg") && ($("#chg").onclick=()=>{ team=null; sent=[]; persist(); renderTeam(); });
    $("#send").onclick = () => {
      const nombre=$("#nombre").value.trim(), puesto=$("#puesto").value.trim();
      const a=QUESTIONS.map((_,i)=>$("#a"+i).value.trim());
      if(!nombre||!puesto){ $("#e").textContent="Completá tu nombre y tu puesto."; return; }
      const empty=a.findIndex(x=>!x);
      if(empty>-1){ $("#e").textContent=`Falta responder la pregunta ${empty+1}.`; return; }
      const btn=$("#send"); btn.disabled=true; btn.textContent="Enviando…"; $("#e").textContent="";
      const fail=()=>{ btn.disabled=false; btn.textContent="Enviar mis respuestas"; $("#e").textContent="No se pudo enviar. Revisá la conexión y probá de nuevo."; };
      if(!sb) return fail();
      sb.from("respuestas").insert({equipo:team,nombre,puesto,p1:a[0],p2:a[1],p3:a[2],p4:a[3],p5:a[4]})
        .then(({error})=>{ if(error) return fail(); sent.push({nombre,puesto}); persist(); editing=false; renderTeam(); window.scrollTo(0,0); }, fail);
    };
    return;
  }
  app.innerHTML = `<div class="stack">
    <div class="row" style="justify-content:space-between"><h1 style="font-size:clamp(28px,5vw,44px)">${esc(team)}</h1><button class="link" id="chg2">Cambiar de equipo</button></div>
    <p style="max-width:56ch">¡Gracias! Pásense el dispositivo: cada integrante carga sus respuestas. Después, compártanlas en voz alta dentro del equipo.</p>
    <div class="stack">${sent.map(p=>`<div class="person"><div><b>${esc(p.nombre)}</b><br><span class="muted">${esc(p.puesto)}</span></div><span class="done">Enviado</span></div>`).join("")}</div>
    <div class="row"><button class="btn btn-cta" id="add">Cargar otra persona</button><span class="muted">${sent.length} ${sent.length===1?"integrante cargado":"integrantes cargados"}</span></div>
  </div>`;
  $("#add").onclick=()=>{ editing=true; renderTeam(); window.scrollTo(0,0); };
  $("#chg2").onclick=()=>{ if(confirm("¿Cambiar de equipo? Las respuestas ya enviadas quedan guardadas.")){ team=null; sent=[]; persist(); renderTeam(); } };
}

/* ---------- TABLERO ---------- */
let data = null, openTeams = new Set(), boardErr = "";
const fmtTime = t => t ? new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}) : "";
function load(){
  if(!sb){ boardErr="red"; renderBoard(); return; }
  sb.rpc("tablero",{clave:CLAVE}).then(({data:rows,error})=>{
    if(error){ boardErr="red"; renderBoard(); return; }
    data={filas:(rows||[]).map(r=>({id:r.id,at:new Date(r.created_at).getTime(),equipo:r.equipo,nombre:r.nombre,puesto:r.puesto,a:[r.p1,r.p2,r.p3,r.p4,r.p5]}))};
    boardErr=""; renderBoard();
  },()=>{ boardErr="red"; renderBoard(); });
}
function exportRows(){
  const head=["Fecha y hora","Equipo","Nombre y apellido","Puesto",...QUESTIONS.map((q,i)=>`${i+1}. ${q.t}`)];
  return [head,...data.filas.map(p=>[new Date(p.at).toLocaleString("es-AR"),p.equipo,p.nombre,p.puesto,...p.a])];
}
function download(kind){
  const rows=exportRows(), date=new Date().toISOString().slice(0,10), name=`roles-team-building-333-${date}.${kind}`;
  if(kind==="xlsx"){
    if(!window.XLSX){ alert("Excel no está disponible ahora. Probá con CSV."); return; }
    const ws=XLSX.utils.aoa_to_sheet(rows); ws["!cols"]=rows[0].map((_,i)=>({wch:i<4?20:45}));
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Respuestas"); XLSX.writeFile(wb,name); return;
  }
  const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const blob=new Blob(["\uFEFF"+rows.map(r=>r.map(cell).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function renderBoard(){
  if(boardErr==="clave"){ app.innerHTML=`<div class="card"><h2>Acceso restringido</h2><p class="muted" style="margin-top:6px">Este tablero necesita la clave correcta en el link.</p></div>`; return; }
  if(!data){ app.innerHTML=`<p class="muted">${boardErr?"No se pudo conectar. Reintentando…":"Cargando respuestas…"}</p>`; return; }
  const ps = data.filas.slice().sort((a,b)=>a.equipo.localeCompare(b.equipo,"es",{numeric:true})||a.nombre.localeCompare(b.nombre));
  const teams=[...new Set(ps.map(p=>p.equipo))].map(t=>({t,people:ps.filter(p=>p.equipo===t)}));
  const last=ps.reduce((m,p)=>Math.max(m,p.at||0),0);
  app.innerHTML = `<div class="stack">
    <div class="row" style="justify-content:space-between"><h1 style="font-size:clamp(28px,4vw,40px)">Tablero en vivo</h1>
      ${ps.length?`<div class="row"><button class="btn btn-main" id="xlsx">Descargar Excel</button><button class="btn btn-ghost" id="csv">CSV</button></div>`:""}</div>
    ${boardErr?`<p class="err">Sin conexión. Reintentando…</p>`:""}
    <div class="kpis">
      <div class="kpi"><div class="v">${teams.length}</div><div class="l">Equipos con respuestas</div></div>
      <div class="kpi"><div class="v">${ps.length}</div><div class="l">Personas que respondieron</div></div>
      <div class="kpi"><div class="v">${teams.length?Math.round(ps.length/teams.length*10)/10:0}</div><div class="l">Promedio por equipo</div></div>
      <div class="kpi"><div class="v" style="font-size:30px">${last?fmtTime(last):"–"}</div><div class="l">Última respuesta</div></div>
    </div>
    ${ps.length?"":`<div class="note">Todavía no llegaron respuestas. Esta pantalla se actualiza sola cada 10 segundos. Si ya hay respuestas y no las ves, revisá la clave del link.</div>`}
    <div class="tgrid">${teams.map(({t,people})=>`
      <details class="card tcard" data-t="${esc(t)}" ${openTeams.has(t)?"open":""}>
        <summary><span class="tname">${esc(t)}</span><span class="tcount">${people.length} ${people.length===1?"persona":"personas"}</span>
          <ul class="names">${people.map(p=>`<li><b>${esc(p.nombre)}</b> <span class="muted">· ${esc(p.puesto)}</span></li>`).join("")}</ul>
          <span class="more">${openTeams.has(t)?"Ocultar respuestas":"Ver respuestas"}</span></summary>
        <div class="stack" style="margin-top:14px">${people.map(p=>`
          <div class="pans"><div class="row" style="justify-content:space-between"><h3>${esc(p.nombre)} <span class="muted" style="font-weight:500">· ${esc(p.puesto)} · ${fmtTime(p.at)}</span></h3><button class="link" data-del="${p.id}" data-n="${esc(p.nombre)}" style="color:var(--naranja)">Borrar</button></div>
          ${QUESTIONS.map((q,i)=>`<div><small>${i+1}. ${q.t}</small><p>${esc(p.a[i])}</p></div>`).join("")}</div>`).join("")}</div>
      </details>`).join("")}</div>
  </div>`;
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=(ev)=>{
    ev.preventDefault();
    if(!confirm(`¿Borrar la respuesta de ${b.dataset.n}?`)) return;
    sb.rpc("borrar_respuesta",{clave:CLAVE,rid:+b.dataset.del}).then(({error})=>{ if(error) alert("No se pudo borrar. ¿Corriste el SQL de borrado?"); load(); });
  });
  $("#xlsx") && ($("#xlsx").onclick=()=>download("xlsx"));
  $("#csv") && ($("#csv").onclick=()=>download("csv"));
  app.querySelectorAll("details.tcard").forEach(d=>d.ontoggle=()=>{ d.open?openTeams.add(d.dataset.t):openTeams.delete(d.dataset.t); const m=d.querySelector(".more"); if(m) m.textContent=d.open?"Ocultar respuestas":"Ver respuestas"; });
}

if(VISTA==="tablero"){ renderBoard(); load(); setInterval(()=>{ if(!document.hidden) load(); },10000); }
else renderTeam();
